<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#f5f6f8}.card{fill:#ffffff;stroke:#e3e6ea}
    .box{fill:#fafbfc;stroke:#c9d0d8}.ha{fill:#e3f3fd;stroke:#03a9f4}.dead{fill:none;stroke:#b9c0c8;stroke-dasharray:6 5}
    .t{fill:#2b3038}.m{fill:#8a929c}.h{fill:#2b3038}.acc{fill:#0277bd}
    .ln{stroke:#4a90d9;stroke-width:2;fill:none}.wire{stroke:#8a929c;stroke-width:2;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#14171c}.card{fill:#1d2127;stroke:#2b313a}
      .box{fill:#232830;stroke:#3a424d}.ha{fill:#12303f;stroke:#7fd3ff}.dead{stroke:#4a525c}
      .t{fill:#e7ebf0}.m{fill:#9aa3ad}.h{fill:#e7ebf0}.acc{fill:#7fd3ff}
      .ln{stroke:#7fb3ff}.wire{stroke:#9aa3ad}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a90d9"/>
    </marker>
  </defs>
  <rect class="bg" width="860" height="420"/>

  <!-- left: cloud mode -->
  <rect class="card" x="20" y="20" width="400" height="360" rx="14" stroke-width="1.5"/>
  <text class="h" x="40" y="52" font-size="17" font-weight="700">Cloud mode</text>
  <text class="m" x="40" y="72" font-size="12.5">default — works out of the box, needs internet</text>

  <rect class="box" x="40" y="96" width="140" height="50" rx="10"/>
  <text class="t" x="110" y="117" font-size="13.5" font-weight="600" text-anchor="middle">Boiler</text>
  <text class="m" x="110" y="134" font-size="11.5" text-anchor="middle">RBK-197</text>

  <line class="wire" x1="180" y1="121" x2="240" y2="121"/>
  <text class="m" x="210" y="113" font-size="10.5" text-anchor="middle">cable</text>

  <rect class="box" x="240" y="96" width="160" height="50" rx="10"/>
  <text class="t" x="320" y="117" font-size="13.5" font-weight="600" text-anchor="middle">Wi-Fi controller</text>
  <text class="m" x="320" y="134" font-size="11.5" text-anchor="middle">WF-100W</text>

  <rect class="box" x="120" y="206" width="200" height="50" rx="10"/>
  <text class="t" x="220" y="227" font-size="13.5" font-weight="600" text-anchor="middle">Rinnai cloud</text>
  <text class="m" x="220" y="244" font-size="11.5" text-anchor="middle">wifiboilers1.rinnai.co.kr</text>

  <rect class="ha" x="120" y="316" width="200" height="50" rx="10" stroke-width="1.5"/>
  <text class="t" x="220" y="337" font-size="13.5" font-weight="600" text-anchor="middle">Home Assistant</text>
  <text class="m" x="220" y="354" font-size="11.5" text-anchor="middle">this integration</text>

  <path class="ln" d="M320 146 L320 176 Q320 181 315 181 L260 181 Q255 181 255 186 L255 206" marker-end="url(#a)"/>
  <text class="acc" x="262" y="198" font-size="11">TCP 9105, every ~5 s</text>

  <path class="ln" d="M220 316 L220 256" marker-end="url(#a)"/>
  <text class="acc" x="232" y="290" font-size="11">HTTPS poll, every 60 s</text>

  <!-- right: local mode -->
  <rect class="card" x="440" y="20" width="400" height="360" rx="14" stroke-width="1.5"/>
  <text class="h" x="460" y="52" font-size="17" font-weight="700">Local mode</text>
  <text class="m" x="460" y="72" font-size="12.5">nothing leaves your network</text>

  <rect class="box" x="460" y="96" width="140" height="50" rx="10"/>
  <text class="t" x="530" y="117" font-size="13.5" font-weight="600" text-anchor="middle">Boiler</text>
  <text class="m" x="530" y="134" font-size="11.5" text-anchor="middle">RBK-197</text>

  <line class="wire" x1="600" y1="121" x2="660" y2="121"/>
  <text class="m" x="630" y="113" font-size="10.5" text-anchor="middle">cable</text>

  <rect class="box" x="660" y="96" width="160" height="50" rx="10"/>
  <text class="t" x="740" y="117" font-size="13.5" font-weight="600" text-anchor="middle">Wi-Fi controller</text>
  <text class="m" x="740" y="134" font-size="11.5" text-anchor="middle">WF-100W</text>

  <rect class="ha" x="540" y="206" width="200" height="64" rx="10" stroke-width="1.5"/>
  <text class="t" x="640" y="228" font-size="13.5" font-weight="600" text-anchor="middle">Home Assistant</text>
  <text class="m" x="640" y="245" font-size="11.5" text-anchor="middle">built-in server on port 9105</text>
  <text class="m" x="640" y="260" font-size="11.5" text-anchor="middle">answers exactly like the cloud</text>

  <path class="ln" d="M740 146 L740 176 Q740 181 735 181 L680 181 Q675 181 675 186 L675 206" marker-end="url(#a)"/>
  <text class="acc" x="682" y="198" font-size="11">HTTP 9105, every ~5 s</text>

  <rect class="dead" x="540" y="316" width="200" height="50" rx="10" stroke-width="1.5"/>
  <text class="m" x="640" y="337" font-size="13" text-anchor="middle">Rinnai cloud</text>
  <text class="m" x="640" y="354" font-size="11.5" text-anchor="middle">never contacted</text>

  <text class="m" x="430" y="404" font-size="11.5" text-anchor="middle">Switching is automatic: the moment the controller registers on the local server, the cloud is no longer used.</text>
</svg>
